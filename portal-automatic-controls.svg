<svg xmlns="http://www.w3.org/2000/svg" width="960" height="485" viewBox="0 0 960 485" role="img" aria-labelledby="title desc">
  <title id="title">KRS Automatic Movement controls</title>
  <desc id="desc">Static illustration of the portal's Movement speed, Rest dwell, Out-position dwell, Positions before home, editable maximum values, and Start random movement button.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif}</style>
  <rect width="960" height="485" fill="#050505"/>
  <g transform="translate(0,-550)">
    <rect x="312" y="573" width="336" height="416" fill="#101010" stroke="#292929"/>
    <text x="328" y="598" fill="#f5f5f2" font-size="15" font-weight="bold">AUTOMATIC MOVEMENT</text>
    <g fill="#f5f5f2" font-size="13">
      <text x="328" y="631">Rest dwell</text><text x="631" y="631" text-anchor="end">1 second</text>
      <text x="328" y="696">Out-position dwell</text><text x="631" y="696" text-anchor="end">1 second</text>
      <text x="328" y="761">Positions before home</text><text x="631" y="761" text-anchor="end">1 position</text>
      <text x="328" y="826">Movement speed</text><text x="631" y="826" text-anchor="end">5</text>
    </g>
    <g stroke="#444" stroke-width="4"><path d="M328 656H558"/><path d="M328 721H558"/><path d="M328 786H558"/><path d="M328 851H558"/></g>
    <g stroke="#df1f2d" stroke-width="4"><path d="M328 721H374"/><path d="M328 851H443"/></g>
    <g fill="#df1f2d"><circle cx="328" cy="656" r="7"/><circle cx="374" cy="721" r="7"/><circle cx="328" cy="786" r="7"/><circle cx="443" cy="851" r="7"/></g>
    <g fill="#050505" stroke="#292929"><rect x="578" y="640" width="54" height="32"/><rect x="578" y="705" width="54" height="32"/><rect x="578" y="770" width="54" height="32"/></g>
    <g fill="#f5f5f2" text-anchor="middle" font-size="14"><text x="605" y="661">5</text><text x="605" y="726">5</text><text x="605" y="791">5</text></g>
    <rect x="328" y="886" width="304" height="46" fill="#df1f2d"/>
    <text x="480" y="914" text-anchor="middle" fill="#f5f5f2" font-size="12" font-weight="bold" letter-spacing="1">START RANDOM MOVEMENT</text>
    <text x="328" y="955" fill="#a9a9a3" font-size="11">The target visits the selected number of random</text>
    <text x="328" y="972" fill="#a9a9a3" font-size="11">positions, then returns home.</text>
  </g>
  <text x="480" y="465" text-anchor="middle" fill="#a9a9a3" font-size="9">CONTROL-PANEL ILLUSTRATION · NOT INTERACTIVE</text>
</svg>
